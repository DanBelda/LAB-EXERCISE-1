<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a31">
  <title>Page not found | Dan Belda</title>
  <style>
    :root{color-scheme:light;--bg:#f5f7fb;--surface:#fff;--ink:#17243b;--muted:#526178;--accent:#4960df;--mint:#72dfc4}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0e1422;--surface:#151e30;--ink:#edf2fb;--muted:#b0bfd4;--accent:#91a0ff}}
    *{box-sizing:border-box}body{display:grid;min-height:100vh;margin:0;padding:1.5rem;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",Arial,sans-serif}.card{width:min(100%,560px);padding:clamp(1.5rem,5vw,3rem);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);border-radius:24px;background:var(--surface);box-shadow:0 20px 60px rgba(16,26,49,.12)}.mark{display:grid;width:44px;height:44px;place-items:center;border-radius:13px;background:var(--mint);color:#101a31;font-weight:800}.code{margin:1.5rem 0 0;color:var(--accent);font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:.35rem 0;font-size:clamp(2rem,7vw,3rem);line-height:1.1;letter-spacing:-.04em}p{color:var(--muted)}a{display:inline-block;margin-top:.75rem;padding:.75rem 1rem;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none}a:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
  </style>
</head>
<body><main class="card"><span class="mark" aria-hidden="true">DB</span><p class="code">404 · Page not found</p><h1>This page isn’t here.</h1><p>The address may be incorrect, or the page may have moved. Return to the portfolio to continue.</p><a href="/">Back to the portfolio</a></main></body>
</html>
